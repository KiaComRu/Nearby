name: Test Nearby
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check public/app.js
      - run: node --check desktop/windows/host.mjs
      - run: npm run build:web
      - run: node --check browser/app.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:web
      - run: php -l browser/api.php
      - run: php -l browser/relay.php
      - run: npm run test:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pwa
      - run: npm run test:pc
      - run: npm run test:desktop:parity
      - run: npm run test:trusted
      - run: npm run test:discovery
        env:
          NEARBY_TEST_DISCOVERY_IN_MEMORY: '1'
      - run: npm run test:internet
      - name: Browser end-to-end checks
        run: npm run test:browser
