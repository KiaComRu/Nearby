# Insert before the existing Nearby subdomain mapping in the hosting root .htaccess.
# The public /web URL must redirect before Apache resolves the internal /nearby directory.
RewriteCond %{HTTP_HOST} ^nearby\.kiacom\.ru(?::[0-9]+)?$ [NC]
RewriteCond %{REQUEST_URI} ^/web$
RewriteRule ^web$ https://nearby.kiacom.ru/web/ [R=301,L]
